[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auren-sst-modulos"
version = "0.1.0"
description = "Módulos Python de la plataforma SST en vivo de Auren Advisory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.21",
    "python-dotenv>=1.0",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "tzdata>=2024.1",  # Windows no trae la base de zonas horarias (America/Bogota)
]

[project.optional-dependencies]
# Servidor de prueba que imita la API local de la plataforma
receptor = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
# Entorno de desarrollo completo: receptor + pruebas
dev = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pytest>=8.0",
    "pyyaml>=6.0",  # perfiles del módulo EPP (sus pruebas no necesitan cámara ni modelos)
]
# Módulo EPP. PyTorch se instala aparte, con el índice que corresponda a la GPU
# (ver modulos/epp/README.md); sin eso, pip trae la versión solo-CPU.
epp = [
    "ultralytics>=8.4",
    "pyyaml>=6.0",
    "imagehash>=4.3",  # solo para preparar el dataset
]

[tool.setuptools.packages.find]
include = ["modulos*", "herramientas*"]

[tool.setuptools.package-data]
"modulos.comun" = ["modelos/*.onnx"]
"herramientas.receptor_prueba" = ["*.html"]
# Tablas REBA, mensajes, recomendaciones y configuración por defecto del módulo de ergonomía
"modulos.ergonomia.nucleo" = ["*.json"]
"modulos.ergonomia.config" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
