[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auren-sst-modulos"
version = "0.1.0"
description = "Módulos Python de la plataforma SST en vivo de Auren Advisory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.21",
    "python-dotenv>=1.0",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "tzdata>=2024.1",  # Windows no trae la base de zonas horarias (America/Bogota)
]

[project.optional-dependencies]
# Servidor de prueba que imita la API local de la plataforma
receptor = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
# Entorno de desarrollo completo: receptor + pruebas
dev = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["modulos*", "herramientas*"]

[tool.setuptools.package-data]
"modulos.comun" = ["modelos/*.onnx"]
"herramientas.receptor_prueba" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["pruebas"]
