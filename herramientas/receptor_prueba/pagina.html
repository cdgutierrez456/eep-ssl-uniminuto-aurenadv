<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receptor de prueba · SST en vivo</title>
<style>
  :root {
    --deep: #12343B;
    --negro: #111414;
    --marfil: #F2F1EA;
    --lima: #C8F169;
    --tenue: rgba(242, 241, 234, .6);
    --borde: rgba(242, 241, 234, .12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--negro); color: var(--marfil);
    font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  header {
    background: var(--deep); padding: 20px 24px; border-bottom: 1px solid var(--borde);
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px;
  }
  h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: .01em; }
  .aviso { color: var(--tenue); font-size: 13px; }
  .estado { margin-left: auto; font-size: 13px; color: var(--tenue); display: flex; align-items: center; gap: 8px; }
  .punto { width: 9px; height: 9px; border-radius: 50%; background: var(--lima); }
  .punto.caido { background: #E5604D; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
  .vacio { color: var(--tenue); padding: 48px 0; text-align: center; }
  article {
    background: var(--deep); border: 1px solid var(--borde); border-left: 4px solid var(--tenue);
    border-radius: 6px; padding: 12px 16px; margin-bottom: 10px;
  }
  article.sev-baja { border-left-color: #7FB7BE; }
  article.sev-media { border-left-color: #E8B84A; }
  article.sev-alta { border-left-color: #EE8B45; }
  article.sev-critica { border-left-color: #E5604D; }
  .linea { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
  .hora { font-variant-numeric: tabular-nums; color: var(--tenue); }
  .estacion { font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 13px; }
  .tipo { font-weight: 600; }
  .etiqueta {
    font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
    border: 1px solid var(--borde); border-radius: 999px; padding: 1px 10px; color: var(--tenue);
  }
  .sesion { margin-left: auto; color: var(--tenue); font-size: 13px; }
  h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--tenue); margin: 4px 0 10px; }
  #config { margin-bottom: 28px; }
  .modulo { background: var(--deep); border: 1px solid var(--borde); border-radius: 6px; padding: 14px 16px; margin-bottom: 10px; }
  .modulo .fila { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  .modulo .nombre { font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 13px; min-width: 70px; }
  .modulo label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .modulo select {
    background: var(--negro); color: var(--marfil); border: 1px solid var(--borde); border-radius: 4px;
    padding: 5px 8px; font: inherit;
  }
  .interruptor { appearance: none; width: 34px; height: 18px; border-radius: 999px; background: var(--negro);
    border: 1px solid var(--tenue); position: relative; cursor: pointer; margin: 0; }
  .interruptor::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px;
    border-radius: 50%; background: var(--tenue); transition: left .12s; }
  .interruptor:checked { border-color: var(--lima); }
  .interruptor:checked::after { left: 18px; background: var(--lima); }
  .nota { color: var(--tenue); font-size: 13px; }
  pre {
    margin: 8px 0 0; white-space: pre-wrap; word-break: break-word; color: var(--tenue);
    font: 13px/1.45 Consolas, "Cascadia Mono", Menlo, monospace;
  }
</style>
</head>
<body>
<header>
  <h1>Receptor de prueba · SST en vivo</h1>
  <span class="aviso">Herramienta de desarrollo. No es la plataforma final.</span>
  <span class="estado"><span class="punto" id="punto"></span><span id="conteo">Conectando…</span></span>
</header>
<main>
  <section id="config" hidden>
    <h2>Configuración de módulos</h2>
    <div id="modulos"></div>
  </section>
  <h2>Eventos</h2>
  <div id="lista"><p class="vacio">Esperando eventos…</p></div>
</main>
<script>
  const lista = document.getElementById("lista");
  const conteo = document.getElementById("conteo");
  const punto = document.getElementById("punto");

  function elemento(etiqueta, clase, texto) {
    const nodo = document.createElement(etiqueta);
    if (clase) nodo.className = clase;
    if (texto !== undefined) nodo.textContent = texto;   // textContent: nunca HTML de los eventos
    return nodo;
  }

  function tarjeta(evento) {
    const articulo = elemento("article", "sev-" + evento.severidad);
    const linea = elemento("div", "linea");
    linea.append(
      elemento("span", "hora", evento.timestamp.slice(11, 19)),
      elemento("span", "estacion", evento.estacion),
      elemento("span", "tipo", evento.tipo),
      elemento("span", "etiqueta", evento.severidad)
    );
    if (evento.sesion_id) linea.append(elemento("span", "sesion", "Sesión " + evento.sesion_id));
    articulo.append(linea, elemento("pre", "", JSON.stringify(evento.datos, null, 1)));
    if (evento.adjuntos && evento.adjuntos.length) {
      articulo.append(elemento("pre", "", "Adjuntos: " + evento.adjuntos.map(a => a.ruta).join(", ")));
    }
    return articulo;
  }

  let ultimaFirma = "";
  async function actualizar() {
    try {
      const respuesta = await fetch("/api/eventos?limite=50", { cache: "no-store" });
      const eventos = (await respuesta.json()).reverse();   // el más reciente arriba
      punto.classList.remove("caido");
      conteo.textContent = eventos.length ? "Últimos " + eventos.length + " eventos" : "Sin eventos todavía";
      const firma = eventos.map(e => e.id).join();
      if (firma === ultimaFirma) return;
      ultimaFirma = firma;
      lista.replaceChildren(...(eventos.length ? eventos.map(tarjeta) : [elemento("p", "vacio", "Esperando eventos…")]));
    } catch (error) {
      punto.classList.add("caido");
      conteo.textContent = "Receptor sin respuesta";
    }
  }
  // ---- Configuración de módulos: se arma desde las capacidades que cada módulo registró ----
  const seccionConfig = document.getElementById("config");
  const contenedorModulos = document.getElementById("modulos");

  async function guardarConfig(modulo, config) {
    await fetch("/api/modulos/" + encodeURIComponent(modulo) + "/config", {
      method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(config)
    });
    firmaModulos = "";
    actualizarModulos();
  }

  function tarjetaModulo(modulo, estado) {
    const caja = elemento("div", "modulo");
    const fila = elemento("div", "fila");
    fila.append(elemento("span", "nombre", modulo));
    const perfiles = estado.capacidades && estado.capacidades.perfiles;
    if (!perfiles) {
      fila.append(elemento("span", "nota", "Este módulo no declaró perfiles configurables."));
    } else if (!estado.config) {
      fila.append(elemento("span", "nota", "Esperando la configuración del módulo…"));
    } else {
      const config = estado.config;
      const selector = document.createElement("select");
      for (const [id, perfil] of Object.entries(perfiles)) {
        const opcion = elemento("option", "", perfil.nombre || id);
        opcion.value = id;
        opcion.selected = id === config.perfil_activo;
        selector.append(opcion);
      }
      selector.addEventListener("change", () => guardarConfig(modulo, { ...config, perfil_activo: selector.value }));
      const etiquetaPerfil = elemento("label", "", "Perfil activo ");
      etiquetaPerfil.append(selector);
      fila.append(etiquetaPerfil);

      const activo = perfiles[config.perfil_activo];
      const requeridos = ((config.perfiles || {})[config.perfil_activo] || {}).elementos_requeridos || [];
      for (const item of (activo ? activo.elementos : [])) {
        const interruptor = document.createElement("input");
        interruptor.type = "checkbox";
        interruptor.className = "interruptor";
        interruptor.checked = requeridos.includes(item.id);
        interruptor.addEventListener("change", () => {
          const nuevos = activo.elementos.map(e => e.id).filter(id =>
            id === item.id ? interruptor.checked : requeridos.includes(id));
          guardarConfig(modulo, {
            ...config,
            perfiles: { ...(config.perfiles || {}), [config.perfil_activo]: { elementos_requeridos: nuevos } }
          });
        });
        const etiqueta = elemento("label");
        etiqueta.append(interruptor, elemento("span", "", item.nombre || item.id));
        fila.append(etiqueta);
      }
    }
    caja.append(fila);
    return caja;
  }

  let firmaModulos = "";
  async function actualizarModulos() {
    try {
      const modulos = await (await fetch("/api/modulos", { cache: "no-store" })).json();
      const firma = JSON.stringify(modulos);
      if (firma === firmaModulos) return;
      firmaModulos = firma;
      const nombres = Object.keys(modulos);
      seccionConfig.hidden = nombres.length === 0;
      contenedorModulos.replaceChildren(...nombres.map(nombre => tarjetaModulo(nombre, modulos[nombre])));
    } catch (error) { /* el indicador de estado ya avisa que el receptor no responde */ }
  }

  actualizar();
  actualizarModulos();
  setInterval(actualizar, 2000);
  setInterval(actualizarModulos, 2000);
</script>
</body>
</html>
